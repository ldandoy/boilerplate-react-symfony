services:
  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: boilterplate_front
    volumes:
      - ./frontend:/app
      # node_modules reste dans le conteneur : évite des fichiers root dans ./frontend
      - /app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - boilterplate

  back:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: dev
      args:
        INSTALL_XDEBUG: "true"
    container_name: boilterplate_back
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8001:8080"
    environment:
      APP_ENV: dev
      SERVER_NAME: :8080
      CADDY_MERCURE: "off"
      XDEBUG_MODE: "debug" # active avec XDEBUG_MODE=debug
    depends_on:
      - db
    networks:
      - boilterplate

  db:
    image: mysql:8.0
    container_name: boilterplate_db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - boilterplate

  phpmyadmin:
    image: phpmyadmin
    container_name: boilterplate_phpmyadmin
    restart: unless-stopped
    ports:
      - 8080:80
    depends_on:
      - db
    environment:
      - PMA_HOST=boilterplate_db
      - UPLOAD_LIMIT=64M
    networks:
      - boilterplate

  mailpit:
    image: axllent/mailpit:latest
    container_name: boilterplate_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # UI Mailpit
      - "1025:1025" # SMTP
    networks:
      - boilterplate

networks:
  boilterplate:
