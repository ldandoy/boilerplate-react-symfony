parameters:
    app.frontend_url: '%env(FRONTEND_URL)%'

services:
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\:
        resource: "../src/"

    App\OpenApi\JwtDecorator:
        decorates: "api_platform.openapi.factory"
        arguments: ["@.inner"]
        decoration_priority: -10

    App\Security\EmailVerifier:
        arguments:
            $frontendUrl: '%app.frontend_url%'

    App\State\ForgotPasswordProcessor:
        arguments:
            $frontendUrl: '%app.frontend_url%'

    # Desactive le listener par defaut du bundle gesdinet (bugue dans v2.0.0-beta)
    # On utilise notre propre AuthenticationSuccessListener a la place
    gesdinet_jwt_refresh_token.event_listener.attach_refresh_token:
        class: Gesdinet\JWTRefreshTokenBundle\EventListener\AttachRefreshTokenOnSuccessListener
        tags: []
