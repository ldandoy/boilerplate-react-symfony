name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Tests PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Le suffixe "_test" est ajouté par doctrine.yaml => base app_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app?serverVersion=8.0.32&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Security audit
        working-directory: backend
        run: composer audit

      - name: Prepare test environment
        working-directory: backend
        run: |
          php bin/console lexik:jwt:generate-keypair --env=test --skip-if-exists
          php bin/console doctrine:database:create --env=test --if-not-exists
          # assets/vendor est ignoré par Git : sans lui, importmap() fait planter les pages Twig (/login)
          php bin/console importmap:install

      # Échoue si une entité a été modifiée sans migration correspondante
      - name: Check migrations match entities
        working-directory: backend
        run: |
          php bin/console doctrine:migrations:migrate -n --env=test
          php bin/console doctrine:schema:validate --env=test

      - name: Run PHPUnit
        working-directory: backend
        run: bin/phpunit

  frontend-tests:
    name: Tests Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue depuis le champ "packageManager" de package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Security audit
        working-directory: frontend
        run: pnpm audit --prod

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Run Vitest
        working-directory: frontend
        run: pnpm test:coverage

      - name: Build
        working-directory: frontend
        run: pnpm build